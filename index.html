<link rel="icon" type="image/png" href="/icons/logo.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NixlAI">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithPopup, signInWithCustomToken, GoogleAuthProvider, GithubAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDocs, collection } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyCnavvxwXRc7ewTNIiFYx_YPdFwxJTBlEc",
  authDomain: "nixlai.firebaseapp.com",
  projectId: "nixlai",
  storageBucket: "nixlai.firebasestorage.app",
  messagingSenderId: "414717106260",
  appId: "1:414717106260:web:45d28637e1a86ecdb8f5c1",
  measurementId: "G-N0JPWW2RCT"
});
const auth = getAuth(app), db = getFirestore(app);
const gp = new GoogleAuthProvider(), ghp = new GithubAuthProvider();
window.__nixlai_auth = auth;
window.__nixlai_signIn = () => signInWithPopup(auth, gp);
window.__nixlai_signInGithub = () => signInWithPopup(auth, ghp);
window.__nixlai_signInWithCustomToken = (t) => signInWithCustomToken(auth, t);
window.__nixlai_signOut = () => signOut(auth);
window.__nixlai_onAuthStateChanged = (cb) => onAuthStateChanged(auth, cb);
window.__nixlai_saveChats = async (uid, chats) => {
  for (const c of chats) {
    try {
      const messages = c.messages.map(m => m.image && m.image.startsWith("data:") ? { ...m, image: null } : m);
      await setDoc(doc(db, "users", uid, "chats", String(c.id)), JSON.parse(JSON.stringify({ ...c, messages })));
    } catch (e) { console.error("Save failed for chat", c.id, e); }
  }
};
window.__nixlai_loadChats = async (uid) => {
  const snap = await getDocs(collection(db, "users", uid, "chats"));
  return snap.docs.map(d => d.data()).sort((a, b) => b.id - a.id);
};
window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#04050d;--panel:rgba(11,13,34,.78);--line:rgba(99,102,241,.22);--tx:#eceeff;--sub:#8b90b8;--ac:#6366f1;--ac2:#a855f7;--card2:rgba(10,12,36,.7);--ibg:rgba(8,10,32,.88);--modal:#0a0c24;--nt:#cdd0f5;
--cbg:radial-gradient(circle at 82% 8%,rgba(120,150,255,.5) 0,rgba(60,50,170,.35) 60px,transparent 130px),linear-gradient(180deg,#070824,#04050d 70%);
--abg:radial-gradient(900px 500px at 70% -10%,rgba(88,60,220,.18),transparent),#04050d}
html,body{width:100%;height:100%;overflow:hidden;position:fixed;inset:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);touch-action:manipulation}

button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}

.app{height:100dvh;display:flex;flex-direction:column;gap:10px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--abg);position:relative;z-index:1}
.top{display:flex;align-items:center;gap:12px;padding:8px 16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);flex-shrink:0}

.brand{font-size:22px;font-weight:800;letter-spacing:.5px}

.sp{flex:1}
.pill{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:20px;background:rgba(99,102,241,.1);font-size:13px;font-weight:600}

.ib:hover{background:rgba(99,102,241,.15)}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid rgba(80,200,255,.5)}
.menu-btn{display:none}

.main{flex:1;min-height:0;display:grid;grid-template-columns:240px 1fr 290px;gap:12px}

.td{display:inline-block;width:7px;height:7px;border-radius:50%;background:#818cf8;margin-right:5px;animation:bn 1.2s infinite}
.td:nth-child(2){animation-delay:.2s}.td:nth-child(3){animation-delay:.4s}

.inwrap{position:relative;padding:0 22px 8px;display:flex;flex-direction:column;align-items:center;gap:12px}
.ibox{width:100%;max-width:800px;border:1px solid rgba(129,140,248,.4);border-radius:22px;background:var(--ibg);padding:10px 14px;display:flex;flex-direction:column;gap:6px;position:relative}
.ibox.temp{border-color:#ef4444}
.ibox input.t{width:100%;border:none;background:none;font-size:15px;padding:8px 4px}
.ibox input.t::placeholder{color:#7f85b5}
.irow{display:flex;align-items:center;gap:4px}
.irow .ib{width:32px;height:32px}

.pop button:hover,.pop button.on{background:rgba(99,102,241,.2)}
.pop small{display:block;font-size:11px;color:var(--sub)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:480px;max-height:85vh;overflow-y:auto;background:var(--modal);border:1px solid var(--line);border-radius:18px;padding:20px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px;font-weight:700}
.lab{font-size:11px;color:var(--sub);margin:14px 0 6px;font-weight:700;letter-spacing:.5px}
.fld{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:14px}
select.fld{background:var(--modal)}
.btn{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:rgba(99,102,241,.12);font-size:14px;font-weight:600;margin-top:8px}
.btn.sso{display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{background:rgba(99,102,241,.25)}.btn.red{color:#fca5a5;border-color:rgba(239,68,68,.4)}
.err{font-size:12px;color:#fca5a5;background:rgba(239,68,68,.1);padding:8px;border-radius:8px;margin-bottom:8px}
.mem{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;line-height:1.4}

#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none}
#bgl{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;pointer-events:none}
.app.fx{background:transparent}.fx .center{background:var(--panel)}
.fx .top,.fx .card,.fx .center{backdrop-filter:blur(8px)}
.opts{display:flex;gap:8px}
.opt{flex:1;padding:12px 6px;border-radius:10px;border:1px solid var(--line);font-size:13px;font-weight:600;background:var(--card2)}
.opt.on{border:2px solid var(--ac);box-shadow:0 0 12px rgba(99,102,241,.4)}
[data-theme=light]{--bg:#eef0fb;--panel:rgba(255,255,255,.85);--line:rgba(99,102,241,.25);--tx:#14162e;--sub:#5b6088;--card2:rgba(255,255,255,.92);--ibg:#fff;--modal:#fff;--nt:#2c3060;--cbg:linear-gradient(180deg,#f7f8ff,#e8ebfb);--abg:#eef0fb}

[data-theme=hacker] .u .bub{background:transparent}
[data-theme=hacker] .av{color:#000;background:#0f0;border-color:#0f0}
/* NEW CHAT ANIMATION */
[data-theme=hacker]{--ac2:#00ff41}
.nc{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(99,102,241,.22),transparent 60%),var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:ncFade 1.15s ease both}
.nc::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:linear-gradient(100deg,transparent,rgba(165,180,255,.22),transparent);transform:skewX(-18deg);animation:ncSweep 1s .1s ease-in-out both}
.nc-orb{position:relative;width:104px;height:104px;display:flex;align-items:center;justify-content:center;animation:ncPop .7s cubic-bezier(.2,1.2,.3,1) both}
.nc-ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--ac);opacity:0;animation:ncRing 1.1s ease-out both}
.nc-ring:nth-child(2){animation-delay:.18s}
.nc-ring:nth-child(3){animation-delay:.36s}
.nc-spin{position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 55%,var(--ac) 85%,var(--ac2) 100%);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));animation:ncSpin .9s linear infinite}
.nc-core{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 34px rgba(124,92,255,.65);animation:ncPulse .9s ease-in-out infinite}
.nc-core{position:relative;overflow:hidden}
.nc-logo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;background:#05060f;animation:ncPlus .7s .15s cubic-bezier(.2,1.3,.3,1) both}
.nc-core svg{animation:ncPlus .7s .15s cubic-bezier(.2,1.3,.3,1) both}
.nc-txt{font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--tx);display:flex;align-items:center;gap:2px;animation:ncUp .5s .15s ease both}
.nc-dots span{display:inline-block;animation:bn 1s infinite}
.nc-dots span:nth-child(2){animation-delay:.15s}.nc-dots span:nth-child(3){animation-delay:.3s}
@keyframes ncFade{0%{opacity:0}15%{opacity:1}72%{opacity:1}100%{opacity:0}}
@keyframes ncSweep{from{left:-40%}to{left:120%}}
@keyframes ncPop{from{transform:scale(.3) rotate(-90deg);opacity:0}to{transform:none;opacity:1}}
@keyframes ncRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.6);opacity:0}}
@keyframes ncSpin{to{transform:rotate(360deg)}}
@keyframes ncPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes ncPlus{from{transform:rotate(-180deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes ncUp{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.enter{animation:ncIn .65s .55s cubic-bezier(.2,.8,.2,1) both}
.enter .mc{animation:ncIn .5s cubic-bezier(.2,.8,.2,1) both}
.enter .mc:nth-child(1){animation-delay:.7s}.enter .mc:nth-child(2){animation-delay:.76s}.enter .mc:nth-child(3){animation-delay:.82s}.enter .mc:nth-child(4){animation-delay:.88s}.enter .mc:nth-child(5){animation-delay:.94s}.enter .mc:nth-child(6){animation-delay:1s}
@keyframes ncIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.nc,.nc::before,.nc-orb,.nc-ring,.nc-spin,.nc-core,.nc-core svg,.nc-txt,.nc-dots span,.enter,.enter .mc{animation-duration:.01s!important;animation-delay:0s!important}}
@media(max-width:1100px){.main{grid-template-columns:240px 1fr}.right{display:none}}
@media(max-width:768px){
  .main{grid-template-columns:1fr}
  .menu-btn{display:flex}.tag,.pill{display:none}
  .side{position:fixed;top:0;bottom:0;left:0;width:270px;z-index:90;padding:14px;background:var(--modal);border-right:1px solid var(--line);transform:translateX(-105%);transition:transform .28s ease}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80}
  .modes{grid-template-columns:repeat(3,1fr)}
  .scroll{padding:14px 12px}.inwrap{padding:0 12px 6px}.msg{max-width:92%}
}

<script>
