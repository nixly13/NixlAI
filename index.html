<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NixlAI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCnavvxwXRc7ewTNIiFYx_YPdFwxJTBlEc",
      authDomain: "nixlai.firebaseapp.com",
      projectId: "nixlai",
      storageBucket: "nixlai.firebasestorage.app",
      messagingSenderId: "414717106260",
      appId: "1:414717106260:web:45d28637e1a86ecdb8f5c1",
      measurementId: "G-N0JPWW2RCT"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.__nixlai_auth = auth;
    window.__nixlai_provider = provider;
    window.__nixlai_signIn = () => signInWithPopup(auth, provider);
    window.__nixlai_signOut = () => signOut(auth);
    window.__nixlai_onAuthStateChanged = (cb) => onAuthStateChanged(auth, cb);
    window.dispatchEvent(new Event("firebase-ready"));
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100dvh; width: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; touch-action: manipulation; }
    @media (max-width: 768px) {
      .chat-area { -webkit-overflow-scrolling: touch !important; }
      .input-wrapper { padding: 8px 12px env(safe-area-inset-bottom, 12px) !important; }
      .header-btn-text { display: none; }
      .send-btn { width: 38px !important; height: 38px !important; }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    input:focus, select:focus, textarea:focus, button:focus { outline: none; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(128,128,128,0.3); border-radius: 4px; }

    @keyframes nixlai-bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40% { transform: translateY(-6px); opacity: 1; }
    }
    .nixlai-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #4f46e5;
      animation: nixlai-bounce 1.2s infinite ease-in-out;
      display: inline-block;
    }
    .nixlai-dot:nth-child(2) { animation-delay: 0.2s; }
    .nixlai-dot:nth-child(3) { animation-delay: 0.4s; }

    .action-bar-btn {
      display: flex; align-items: center; gap: 5px;
      background: none; border: 1px solid transparent;
      border-radius: 7px; cursor: pointer;
      padding: 4px 8px; font-size: 12px; font-weight: 500;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
      white-space: nowrap;
    }
    .action-bar-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.13); }
    .action-bar-btn svg { flex-shrink: 0; }

    .user-action-btn {
      display: flex; align-items: center; gap: 5px;
      background: none; border: 1px solid transparent;
      border-radius: 7px; cursor: pointer;
      padding: 4px 8px; font-size: 12px; font-weight: 500;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
    }
    .user-action-btn:hover { background: rgba(255,255,255,0.09); border-color: rgba(255,255,255,0.13); }

    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 20px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .msg-fadein { animation: fadeIn 0.18s ease; }

    .send-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.07); }
    .send-btn:active { transform: scale(0.96); }
  </style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef, useCallback } = React;

// ── SVG Icons ────────────────────────────────────────────────────
const IconPaperPlane = ({ size = 18, color = "white" }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: color, strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("line", { x1: "22", y1: "2", x2: "11", y2: "13" }),
    React.createElement("polygon", { points: "22 2 15 22 11 13 2 9 22 2" })
  )
);
const IconCopy = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("rect", { x: "9", y: "9", width: "13", height: "13", rx: "2", ry: "2" }),
    React.createElement("path", { d: "M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" })
  )
);
const IconThumbUp = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("path", { d: "M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z" }),
    React.createElement("path", { d: "M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3" })
  )
);
const IconThumbDown = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("path", { d: "M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z" }),
    React.createElement("path", { d: "M17 2h2.67A2.31 2.31 0 0 1 22 4v7a2.31 2.31 0 0 1-2.33 2H17" })
  )
);
const IconRefresh = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("polyline", { points: "23 4 23 10 17 10" }),
    React.createElement("path", { d: "M20.49 15a9 9 0 1 1-2.12-9.36L23 10" })
  )
);
const IconCheck = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "#22c55e", strokeWidth: 2.5, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("polyline", { points: "20 6 9 17 4 12" })
  )
);
const IconEdit = ({ size = 13 }) => (
  React.createElement("svg", { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round" },
    React.createElement("path", { d: "M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" }),
    React.createElement("path", { d: "M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" })
  )
);

// ── Thinking dots ────────────────────────────────────────────────
function ThinkingDots({ cardBg, border }) {
  return React.createElement("div", {
    style: { alignSelf: "flex-start", padding: "14px 18px", borderRadius: "18px", backgroundColor: cardBg, border: `1px solid ${border}`, display: "flex", alignItems: "center", gap: "6px" }
  },
    React.createElement("span", { className: "nixlai-dot" }),
    React.createElement("span", { className: "nixlai-dot" }),
    React.createElement("span", { className: "nixlai-dot" })
  );
}

// ── AI message bubble ────────────────────────────────────────────
function AiMessageBubble({ msg, cardBg, text, border, isTemporaryChat, onRetry }) {
  const [hovered, setHovered] = useState(false);
  const [liked, setLiked] = useState(null);
  const [copied, setCopied] = useState(false);

  const handleCopy = () => {
    navigator.clipboard.writeText(msg.text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };

  const btnColor = text;

  return React.createElement("div", {
    className: "msg-fadein",
    style: { alignSelf: "flex-start", display: "flex", flexDirection: "column", gap: "4px", maxWidth: "75%" },
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => setHovered(false)
  },
    React.createElement("div", {
      style: {
        padding: "12px 18px", borderRadius: "18px",
        backgroundColor: cardBg, color: text,
        fontSize: "14px", lineHeight: "1.6",
        border: isTemporaryChat ? "1px dashed rgba(239,68,68,0.35)" : `1px solid ${border}`,
        whiteSpace: "pre-wrap", wordBreak: "break-word"
      }
    }, msg.text),
    React.createElement("div", {
      style: {
        display: "flex", gap: "2px", alignItems: "center",
        opacity: hovered ? 1 : 0,
        transition: "opacity 0.15s ease",
        paddingLeft: "4px"
      }
    },
      React.createElement("button", {
        className: "action-bar-btn", title: copied ? "Copied!" : "Copy",
        onClick: handleCopy,
        style: { color: copied ? "#22c55e" : btnColor }
      }, copied ? React.createElement(IconCheck) : React.createElement(IconCopy), copied ? "Copied" : "Copy"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Regenerate",
        onClick: () => onRetry && onRetry(msg),
        style: { color: btnColor }
      }, React.createElement(IconRefresh), "Regenerate"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Like",
        onClick: () => setLiked(liked === "like" ? null : "like"),
        style: { color: liked === "like" ? "#22c55e" : btnColor, borderColor: liked === "like" ? "rgba(34,197,94,0.4)" : "transparent" }
      }, React.createElement(IconThumbUp), "Like"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Dislike",
        onClick: () => setLiked(liked === "dislike" ? null : "dislike"),
        style: { color: liked === "dislike" ? "#ef4444" : btnColor, borderColor: liked === "dislike" ? "rgba(239,68,68,0.4)" : "transparent" }
      }, React.createElement(IconThumbDown), "Dislike")
    )
  );
}

// ── User message bubble (with edit on hover) ─────────────────────
function UserMessageBubble({ msg, sentMsgBg, textColor, isTemporaryChat, onEdit }) {
  const [hovered, setHovered] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(msg.text);
  const textareaRef = useRef(null);

  useEffect(() => {
    if (editing && textareaRef.current) {
      textareaRef.current.focus();
      textareaRef.current.selectionStart = textareaRef.current.value.length;
    }
  }, [editing]);

  const submitEdit = () => {
    if (editVal.trim() && editVal.trim() !== msg.text) {
      onEdit(msg, editVal.trim());
    }
    setEditing(false);
  };

  return React.createElement("div", {
    className: "msg-fadein",
    style: { alignSelf: "flex-end", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "4px", maxWidth: "75%" },
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => { setHovered(false); }
  },
    editing
      ? React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px", width: "100%", minWidth: "240px" } },
          React.createElement("textarea", {
            ref: textareaRef,
            value: editVal,
            onChange: e => setEditVal(e.target.value),
            onKeyDown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitEdit(); } if (e.key === "Escape") setEditing(false); },
            rows: 3,
            style: {
              width: "100%", padding: "10px 14px", borderRadius: "14px",
              border: "1.5px solid #4f46e5", backgroundColor: sentMsgBg,
              color: textColor, fontSize: "14px", lineHeight: "1.5",
              resize: "none", fontFamily: "inherit"
            }
          }),
          React.createElement("div", { style: { display: "flex", gap: "6px", justifyContent: "flex-end" } },
            React.createElement("button", {
              onClick: () => setEditing(false),
              style: { padding: "5px 12px", borderRadius: "7px", border: "1px solid rgba(128,128,128,0.3)", background: "none", color: textColor, fontSize: "12px", cursor: "pointer" }
            }, "Cancel"),
            React.createElement("button", {
              onClick: submitEdit,
              style: { padding: "5px 12px", borderRadius: "7px", border: "none", background: "#4f46e5", color: "white", fontSize: "12px", cursor: "pointer" }
            }, "Send")
          )
        )
      : React.createElement("div", {
          style: {
            padding: "12px 18px", borderRadius: "18px",
            backgroundColor: sentMsgBg, color: textColor,
            fontSize: "14px", lineHeight: "1.6",
            border: isTemporaryChat ? "1px dashed rgba(239,68,68,0.35)" : "none",
            whiteSpace: "pre-wrap", wordBreak: "break-word"
          }
        }, msg.text),

    !editing && React.createElement("div", {
      style: {
        display: "flex", gap: "2px", justifyContent: "flex-end",
        opacity: hovered ? 1 : 0, transition: "opacity 0.15s ease",
        paddingRight: "4px"
      }
    },
      React.createElement("button", {
        className: "user-action-btn", title: "Edit message",
        onClick: () => setEditing(true),
        style: { color: textColor }
      }, React.createElement(IconEdit), "Edit")
    )
  );
}

// ── Main App ─────────────────────────────────────────────────────
function App() {
  const [firebaseReady, setFirebaseReady] = useState(!!window.__nixlai_signIn);
  const [isRecording, setIsRecording] = useState(false);
  const [isSettingsOpen, setIsSettingsOpen] = useState(false);
  const [isHistoryOpen, setIsHistoryOpen] = useState(false);
  const [currentTheme, setCurrentTheme] = useState("dark");
  const [selectedModel, setSelectedModel] = useState("llama-3.3-70b-versatile");
  const [isTemporaryChat, setIsTemporaryChat] = useState(false);
  const [realName, setRealName] = useState("Guest User");
  const [nickname, setNickname] = useState("Chief");
  const [userEmail, setUserEmail] = useState("");
  const [userPhoto, setUserPhoto] = useState(null);
  const [isUserLoggedIn, setIsUserLoggedIn] = useState(false);
  const [systemPrompt, setSystemPrompt] = useState("You are Nixlai AI, a helpful, precise engineering assistant.");
  const [isAttachMenuOpen, setIsAttachMenuOpen] = useState(false);
  const [activeInputMode, setActiveInputMode] = useState("text");
  const [inputValue, setInputValue] = useState("");
  const [attachedFile, setAttachedFile] = useState(null);
  const [activeChatId, setActiveChatId] = useState(null);
  const [currentChatMessages, setCurrentChatMessages] = useState([]);
  const [historyChats, setHistoryChats] = useState([]);
  const [chatCount, setChatCount] = useState(0);
  const [isThinking, setIsThinking] = useState(false);
  const [authError, setAuthError] = useState("");

  const recognitionRef = useRef(null);
  const fileInputRef = useRef(null);
  const messagesEndRef = useRef(null);

  const isDark = currentTheme === "dark";
  const T = {
    bg: isDark ? "#09090b" : "#f8fafc",
    text: isDark ? "#f4f4f5" : "#0f172a",
    subText: isDark ? "#a1a1aa" : "#64748b",
    barBg: isDark ? "#18181b" : "#ffffff",
    sidebarBg: isDark ? "rgba(24,24,27,0.97)" : "rgba(255,255,255,0.98)",
    cardBg: isDark ? "rgba(255,255,255,0.05)" : "rgba(15,23,42,0.05)",
    border: isDark ? "rgba(255,255,255,0.1)" : "rgba(15,23,42,0.1)",
    shadow: isDark ? "0 25px 50px -12px rgba(0,0,0,0.7)" : "0 25px 50px -12px rgba(15,23,42,0.15)",
    sentMsgBg: isDark ? "rgba(79,70,229,0.18)" : "#e2e8f0",
  };

  useEffect(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [currentChatMessages, isThinking]);

  // Wait for firebase module
  useEffect(() => {
    if (window.__nixlai_signIn) { setFirebaseReady(true); return; }
    const handler = () => setFirebaseReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);

  useEffect(() => {
    if (!firebaseReady || !window.__nixlai_onAuthStateChanged) return;
    const unsub = window.__nixlai_onAuthStateChanged((user) => {
      if (user) {
        setRealName(user.displayName || "Google User");
        setNickname((user.displayName || "Google User").split(" ")[0]);
        setUserEmail(user.email);
        setUserPhoto(user.photoURL);
        setIsUserLoggedIn(true);
      } else {
        setRealName("Guest User"); setNickname("Chief");
        setUserEmail(""); setUserPhoto(null); setIsUserLoggedIn(false);
      }
    });
    return () => unsub && unsub();
  }, [firebaseReady]);

  useEffect(() => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    const r = new SR();
    r.continuous = false; r.interimResults = false; r.lang = "en-US";
    r.onresult = e => setInputValue(p => p ? p + " " + e.results[0][0].transcript : e.results[0][0].transcript);
    r.onend = () => setIsRecording(false);
    r.onerror = () => setIsRecording(false);
    recognitionRef.current = r;
  }, []);

  const handleGoogleSignIn = async () => {
    setAuthError("");
    if (!window.__nixlai_signIn) { setAuthError("Firebase not ready yet, please wait a moment."); return; }
    try {
      await window.__nixlai_signIn();
    } catch (e) {
      console.error(e);
      if (e.code === "auth/popup-blocked") setAuthError("Popup was blocked. Please allow popups for this site.");
      else if (e.code === "auth/cancelled-popup-request" || e.code === "auth/popup-closed-by-user") setAuthError("");
      else setAuthError("Sign-in failed: " + (e.message || e.code));
    }
  };

  const handleSignOut = () => { window.__nixlai_signOut && window.__nixlai_signOut().then(() => setIsSettingsOpen(false)); };

  const handleStartNewChat = () => {
    setActiveChatId(null); setCurrentChatMessages([]);
    setInputValue(""); setAttachedFile(null);
  };

  const handleSelectHistoricChat = (chat) => {
    setActiveChatId(chat.id); setCurrentChatMessages(chat.messages);
    setIsHistoryOpen(false); setIsTemporaryChat(false);
  };

  const toggleRecording = () => {
    if (!recognitionRef.current) return alert("Speech unavailable on this browser.");
    if (isRecording) { recognitionRef.current.stop(); setIsRecording(false); }
    else { recognitionRef.current.start(); setIsRecording(true); }
  };

  const triggerFileExplorer = (mode) => { setActiveInputMode(mode); fileInputRef.current?.click(); setIsAttachMenuOpen(false); };

  const sendToApi = async (userMsgText, history) => {
    setIsThinking(true);
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: selectedModel,
          messages: [{ role: "system", content: systemPrompt }, { role: "user", content: userMsgText }],
          temperature: 0.7, max_tokens: 1000
        })
      });
      const data = await res.json();
      if (data.choices?.[0]?.message?.content) {
        const aiReply = data.choices[0].message.content;
        const updated = [...history, { id: Date.now() + 1, text: aiReply, sender: "ai" }];
        setCurrentChatMessages(updated);
        if (!isTemporaryChat) {
          if (activeChatId === null) {
            const newId = Date.now();
            setHistoryChats(p => [{ id: newId, title: userMsgText.substring(0, 28) + "…", date: "Just now", messages: updated }, ...p]);
            setActiveChatId(newId);
          } else {
            setHistoryChats(p => p.map(c => c.id === activeChatId ? { ...c, messages: updated } : c));
          }
        }
      } else {
        throw new Error(data.error?.message || "Invalid response format");
      }
    } catch (err) {
      console.error(err);
      setCurrentChatMessages(p => [...p, { id: Date.now() + 1, text: `⚠️ API Error: ${err.message}`, sender: "ai" }]);
    } finally {
      setIsThinking(false);
    }
  };

  const handleSendMessage = async () => {
    const txt = inputValue.trim();
    if (!txt && !attachedFile) return;
    let userMsgText = attachedFile ? `[File: ${attachedFile.name}] ${txt}` : txt;
    const newMsg = { id: Date.now(), text: userMsgText, sender: "user" };
    const history = [...currentChatMessages, newMsg];
    setCurrentChatMessages(history);
    setInputValue(""); setAttachedFile(null);
    await sendToApi(userMsgText, history);
    if (!isTemporaryChat) setChatCount(p => p + 1);
  };

  const handleRetry = async (aiMsg) => {
    const idx = currentChatMessages.findIndex(m => m.id === aiMsg.id);
    if (idx < 1) return;
    const prevUser = currentChatMessages.slice(0, idx).reverse().find(m => m.sender === "user");
    if (!prevUser) return;
    const trimmed = currentChatMessages.slice(0, idx);
    setCurrentChatMessages(trimmed);
    await sendToApi(prevUser.text, trimmed);
  };

  const handleEditUserMsg = async (msg, newText) => {
    const idx = currentChatMessages.findIndex(m => m.id === msg.id);
    if (idx === -1) return;
    const updatedMsg = { ...msg, text: newText };
    const trimmed = [...currentChatMessages.slice(0, idx), updatedMsg];
    setCurrentChatMessages(trimmed);
    await sendToApi(newText, trimmed);
  };

  const inputAreaRef = useRef(null);
  useEffect(() => {
    const close = (e) => {
      if (isAttachMenuOpen && inputAreaRef.current && !inputAreaRef.current.contains(e.target)) setIsAttachMenuOpen(false);
    };
    document.addEventListener("mousedown", close);
    return () => document.removeEventListener("mousedown", close);
  }, [isAttachMenuOpen]);

  // ── Render ───────────────────────────────────────────────────
  return React.createElement("div", {
    style: { height: "100vh", width: "100vw", display: "flex", flexDirection: "column", overflow: "hidden", backgroundColor: T.bg, color: T.text }
  },
    React.createElement("input", { type: "file", ref: fileInputRef, onChange: e => { const f = e.target.files[0]; if (f) setAttachedFile({ name: f.name, type: activeInputMode }); e.target.value = ""; }, style: { display: "none" }, accept: activeInputMode === "image" ? "image/*" : "*/*" }),

    // ── HEADER ──
    React.createElement("div", {
