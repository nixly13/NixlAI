// ── Matrix rain background (hacker theme) ─────────────────────────
function useMatrixRain(active, canvasRef) {
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.style.display = active ? "block" : "none";
    if (!active) return;

    const ctx = canvas.getContext("2d");
    let animationId = null;
    let columns = 0;
    let drops = [];
    const fontSize = 15;
    const chars = "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$+-*/=%<>[]{}";

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      columns = Math.max(1, Math.floor(canvas.width / fontSize));
      drops = new Array(columns).fill(0).map(() => Math.random() * -50);
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function draw() {
      // fading trail effect
      ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.font = fontSize + "px 'Courier New', monospace";

      for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        const x = i * fontSize;
        const y = drops[i] * fontSize;

        // Brighter leading character, dimmer trail
        ctx.fillStyle = "#c8ffc8";
        ctx.fillText(char, x, y);
        ctx.fillStyle = "rgba(0, 255, 70, 0.75)";
        ctx.fillText(char, x, y - fontSize);

        if (y > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }

      animationId = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener("resize", resize);
    draw();

    return () => {
      if (animationId) cancelAnimationFrame(animationId);
      window.removeEventListener("resize", resize);
    };
  }, [active, canvasRef]);
}

// ── Rainfall scenery background ────────────────────────────────
function useRainfall(active, canvasRef) {
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    canvas.style.display = active ? "block" : "none";
    if (!active) return;

    const ctx = canvas.getContext("2d");
    let animationId = null;
    let drops = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const count = Math.floor((canvas.width * canvas.height) / 9000);
      drops = new Array(count).fill(0).map(() => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        len: 10 + Math.random() * 20,
        speed: 4 + Math.random() * 6,
        opacity: 0.15 + Math.random() * 0.35
      }));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // subtle dark blue-grey wash to evoke a rainy sky
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, "rgba(15,23,42,0.35)");
      grad.addColorStop(1, "rgba(30,41,59,0.20)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "rgba(174,214,241,0.55)";
      ctx.lineWidth = 1;
      for (let i = 0; i < drops.length; i++) {
        const d = drops[i];
        ctx.globalAlpha = d.opacity;
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x - 2, d.y + d.len);
        ctx.stroke();
        d.y += d.speed;
        d.x -= 0.6;
        if (d.y > canvas.height) {
          d.y = -d.len;
          d.x = Math.random() * canvas.width;
        }
      }
      ctx.globalAlpha = 1;
      animationId = requestAnimationFrame(draw);
    }

    resize();
    window.addEventListener("resize", resize);
    draw();

    return () => {
      if (animationId) cancelAnimationFrame(animationId);
      window.removeEventListener("resize", resize);
    };
  }, [active, canvasRef]);
}

// ── AI message bubble ────────────────────────────────────────────
function AiMessageBubble({ msg, cardBg, text, border, isTemporaryChat, onRetry, themeMode }) {
  const [hovered, setHovered] = useState(false);
  const [liked, setLiked] = useState(null);
  const [copied, setCopied] = useState(false);
  const [displayedText, setDisplayedText] = useState("");

  const isHacker = themeMode === "hacker";

  useEffect(() => {
    if (!isHacker) {
      setDisplayedText(msg.text);
      return;
    }
    // Hacker typing effect
    let i = 0;
    setDisplayedText("");
    const interval = setInterval(() => {
      setDisplayedText(prev => msg.text.substring(0, i + 1));
      i++;
      if (i >= msg.text.length) clearInterval(interval);
    }, 15);
    return () => clearInterval(interval);
  }, [msg.text, isHacker]);

  const handleCopy = () => {
    navigator.clipboard.writeText(msg.text).then(() => {
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    });
  };

  const btnColor = isHacker ? "#0f0" : text;
  const actualBg = isHacker ? "transparent" : cardBg;
  const actualBorder = isHacker ? "none" : (isTemporaryChat ? "1px dashed rgba(239,68,68,0.35)" : `1px solid ${border}`);
  const actualPadding = isHacker ? "12px 0" : "12px 18px";
  const actualColor = isHacker ? "#0f0" : text;

  return React.createElement("div", {
    className: "msg-fadein",
    style: { alignSelf: "flex-start", display: "flex", flexDirection: "column", gap: "4px", maxWidth: "75%" },
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => setHovered(false)
  },
    React.createElement("div", {
      style: {
        padding: actualPadding, borderRadius: isHacker ? "0" : "18px",
        backgroundColor: actualBg, color: actualColor,
        fontSize: "14px", lineHeight: "1.6",
        border: actualBorder,
        whiteSpace: "pre-wrap", wordBreak: "break-word",
        fontFamily: isHacker ? "'Courier New', Courier, monospace" : "inherit"
      }
    }, displayedText),
    React.createElement("div", {
      style: {
        display: "flex", gap: "2px", alignItems: "center",
        opacity: hovered ? 1 : 0,
        transition: "opacity 0.15s ease",
        paddingLeft: "4px"
      }
    },
      React.createElement("button", {
        className: "action-bar-btn", title: copied ? "Copied!" : "Copy",
        onClick: handleCopy,
        style: { color: copied ? (isHacker ? "#fff" : "#22c55e") : btnColor }
      }, copied ? React.createElement(IconCheck) : React.createElement(IconCopy), copied ? "Copied" : "Copy"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Regenerate",
        onClick: () => onRetry && onRetry(msg),
        style: { color: btnColor }
      }, React.createElement(IconRefresh), "Regenerate"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Like",
        onClick: () => setLiked(liked === "like" ? null : "like"),
        style: { color: liked === "like" ? (isHacker ? "#fff" : "#22c55e") : btnColor, borderColor: liked === "like" ? (isHacker ? "#fff" : "rgba(34,197,94,0.4)") : "transparent" }
      }, React.createElement(IconThumbUp), "Like"),

      React.createElement("button", {
        className: "action-bar-btn", title: "Dislike",
        onClick: () => setLiked(liked === "dislike" ? null : "dislike"),
        style: { color: liked === "dislike" ? "#ef4444" : btnColor, borderColor: liked === "dislike" ? "rgba(239,68,68,0.4)" : "transparent" }
      }, React.createElement(IconThumbDown), "Dislike")
    )
  );
}

// ── User message bubble (with edit on hover) ─────────────────────
function UserMessageBubble({ msg, sentMsgBg, textColor, isTemporaryChat, onEdit, themeMode }) {
  const [hovered, setHovered] = useState(false);
  const [editing, setEditing] = useState(false);
  const [editVal, setEditVal] = useState(msg.text);
  const textareaRef = useRef(null);

  const isHacker = themeMode === "hacker";

  useEffect(() => {
    if (editing && textareaRef.current) {
      textareaRef.current.focus();
      textareaRef.current.selectionStart = textareaRef.current.value.length;
    }
  }, [editing]);

  const submitEdit = () => {
    if (editVal.trim() && editVal.trim() !== msg.text) {
      onEdit(msg, editVal.trim());
    }
    setEditing(false);
  };

  const actualBg = isHacker ? "transparent" : sentMsgBg;
  const actualBorder = isHacker ? "none" : (isTemporaryChat ? "1px dashed rgba(239,68,68,0.35)" : "none");
  const actualPadding = isHacker ? "12px 0" : "12px 18px";
  const actualColor = isHacker ? "#00cc00" : textColor;

  return React.createElement("div", {
    className: "msg-fadein",
    style: { alignSelf: "flex-end", display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "4px", maxWidth: "75%" },
    onMouseEnter: () => setHovered(true),
    onMouseLeave: () => { setHovered(false); }
  },
    editing
      ? React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: "6px", width: "100%", minWidth: "240px" } },
          React.createElement("textarea", {
            ref: textareaRef,
            value: editVal,
            onChange: e => setEditVal(e.target.value),
            onKeyDown: e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submitEdit(); } if (e.key === "Escape") setEditing(false); },
            rows: 3,
            style: {
              width: "100%", padding: "10px 14px", borderRadius: "14px",
              border: `1.5px solid ${isHacker ? "#0f0" : "#4f46e5"}`, backgroundColor: actualBg,
              color: actualColor, fontSize: "14px", lineHeight: "1.5",
              resize: "none", fontFamily: isHacker ? "'Courier New', Courier, monospace" : "inherit"
            }
          }),
          React.createElement("div", { style: { display: "flex", gap: "6px", justifyContent: "flex-end" } },
